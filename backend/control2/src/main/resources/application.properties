spring.application.name=control2

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres_db?stringtype=unspecified
spring.datasource.username=admin
spring.datasource.password=admin

# Configuracion de Hibernate y JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en consola (util para ver los ST_Distance, etc.)
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
